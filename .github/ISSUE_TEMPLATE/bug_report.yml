name: Bug Report
description: File a bug report to help us fix issues with Mythos Agent
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check if the issue has already been reported.
        *For security vulnerabilities, please refer to our [SECURITY.md](../SECURITY.md) instead of creating a public issue.*
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run `node index.js --autonomous ...`
        2. Target: `localhost`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, provider used, etc.
      placeholder: |
        - OS: Ubuntu 22.04 / macOS
        - Node version: 20.x
        - Provider: OpenRouter / Anthropic / Mock
    validations:
      required: true
